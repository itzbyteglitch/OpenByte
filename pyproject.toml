[project]
name = "openbyte"
version = "0.2.0"
description = "An open-source AI coding agent with native multi-provider support and Claude Code-style Skills."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.100.0",
]

[project.scripts]
openbyte = "openbyte.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbyte"]
