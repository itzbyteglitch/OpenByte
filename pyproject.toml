[project]
name = "openbyte"
version = "0.4.0"
description = "Open-source autonomous AI coding agent with native multi-provider support, Skills, tools, sessions, MCP, and a full terminal UI."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.100.0",
  "textual>=2.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
openbyte = "openbyte.cli:main"
openbyte-tui = "openbyte.tui:run_tui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbyte"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "openbyte_builtin_skills"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E9", "F"]
