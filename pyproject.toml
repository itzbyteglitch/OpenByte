[project]
name = "openbyte"
version = "0.3.0"
description = "Open-source autonomous AI coding agent with native multi-provider support, Skills, tools, sessions, and MCP configuration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.100.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
openbyte = "openbyte.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openbyte"]
[tool.hatch.build.targets.wheel.force-include]
"skills" = "openbyte_builtin_skills"

[tool.ruff]
line-length = 120
